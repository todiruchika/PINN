# DeepONet on the real commercial-processor thermal maps (src/data/real_thermal.py)
sensor_counts: [5, 8, 10]
seeds: [0, 1, 2, 3, 4]
sensors:
  noise_sigma_C: 1.0        # same sensor model as the simulated dataset
  quant_step_C: 1.0
  calib_sigma_C: 0.5
  margin_px: 3
  energy: 0.95
split_seed: 0
model:
  p: 128
  branch_width: 128
  branch_depth: 3
  trunk_width: 128
  trunk_depth: 4
  activation: tanh
training:
  steps: 6000
  batch_size: 32
  lr: 1.0e-3
  lr_min: 1.0e-5
  n_query: 1024
  eval_every: 200
  patience: 10
