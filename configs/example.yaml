# PINN Thermal Map — protocol parameters
# Fields marked null are BLOCKED (unknown/pending)

die:
  L_m: 0.012        # die side length in metres
  grid_size: 128    # 128x128 ground truth

physics:
  governing_equation: "-div(t_die*k(T)*grad(T)) + h_eff*(T-T_amb) = q(x,y,T)"
  boundary_condition: "adiabatic_neumann_with_distributed_sink"
  conductivity_k: "22714/(T_K-99)+2; clamp to [20,160] W/(m*K)"

nondim:
  T_ref: "T_amb_C"
  deltaT_ref: "peak_temp_C - T_amb_C"

sensors:
  counts: [5, 8, 10]
  noise_sigma_C: 1.0
  quant_step_C: 1.0
  calib_offset_sigma_C: 0.5
  boundary_margin_cells: 3
  global_seed: 42

podqr:
  energy_threshold: 0.95
  T_b_rule: "per_sample_T_amb_C"

splits:
  file: data/raw/dataset/splits.csv

evaluation:
  mask_sensor_nodes: true
  seeds: [0, 1, 2, 3, 4]
