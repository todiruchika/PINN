# PINN Thermal Map — protocol parameters
# Fields marked null are BLOCKED (unknown/pending)

die:
  L_m: 0.012        # die side length in metres
  grid_size: 128    # 128x128 ground truth

physics:
  governing_equation: null   # BLOCKED: linear vs leakage (beta=0.012 unconfirmed)
  boundary_condition: null   # BLOCKED: not T_amb; unknown BC
  conductivity_k: null       # BLOCKED: not in metadata

nondim:
  T_ref: null       # BLOCKED: depends on BC
  deltaT_ref: null  # BLOCKED

sensors:
  counts: [5, 8, 10]
  noise_sigma_C: 1.0
  quant_step_C: 1.0
  calib_offset_sigma_C: 0.5
  boundary_margin_cells: 3
  global_seed: 42

podqr:
  energy_threshold: 0.95
  T_b_rule: "mean_edge"   # PENDING: mean of four edges until BC known

splits:
  file: data/raw/dataset/splits.csv

evaluation:
  mask_sensor_nodes: true
  seeds: [0, 1, 2, 3, 4]
